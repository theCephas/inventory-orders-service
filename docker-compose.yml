services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    env_file: .env
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REPORTING_SERVICE_URL: http://reporting-service:8080
    # Migrations are idempotent, so applying them on every start keeps the container self-contained.
    command: sh -c "yarn migration:run:prod && node dist/main"
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  reporting-service:
    build: ./reporting-service
    environment:
      PORT: 8080
      DATABASE_URL: postgres://reporting_reader:${REPORTING_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    # No published ports: reachable only by the API over the compose network.
    expose:
      - '8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
